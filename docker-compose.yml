services:
  app:
    build:
      context: .
      target: dev
    container_name: alfa-leetcode-api-docker
    ports:
      - '127.0.0.1:3000:3000'
    restart: unless-stopped
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - .:/app
      - /app/node_modules
